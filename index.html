<title>J’apprends à lire</title>
<meta name="theme-color" content="#2446B8">
<style>
/* Concept : un cahier d’écolier à grands carreaux (Seyès) — papier, marge rouge, encre bleue ;
   chaque niveau a la couleur d’un feutre. Andika (police conçue pour les lecteurs débutants) pour tout ce qui se lit. */
:root{
  --paper:#FBFCF8; --line:#DCE3F4; --line-strong:#B4C3EA; --margin:#EF6F7F;
  --fg:#1D2142; --muted:#5D6387; --card:#FFFFFF; --edge:#E1E6F3; --ink:#2446B8; --on-ink:#FFFFFF;
  --sky:#1F8AD6; --hibiscus:#E0407A; --leaf:#1F9D57; --mango:#F07D0A; --grape:#7A55E0; --lagoon:#0B9592; --sun:#E9A800; --brick:#C4492B;
  --good:#1A8F4C; --good-bg:#DCF5E6; --warn:#B66A00; --warn-bg:#FFEFCC; --bad:#D23646; --bad-bg:#FCE0E3;
  --syl-a:#2446B8; --syl-b:#D23646; --guide:#E4E9F7; --hl:#FFE58A;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-read:"Andika","Noto Sans NKo","Comic Sans MS","Segoe UI",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11162D; --line:#1E2647; --line-strong:#2F3B69; --margin:#A9475A;
  --fg:#EEF0FF; --muted:#A5ACD4; --card:#1A2143; --edge:#2A3360; --ink:#8EA8FF; --on-ink:#0E1430;
  --sky:#2A8FD8; --hibiscus:#E04C82; --leaf:#22A35C; --mango:#F08419; --grape:#8462E8; --lagoon:#13A19D; --sun:#F5C53A; --brick:#D9573A;
  --good:#4CD38A; --good-bg:#12392A; --warn:#F2B04A; --warn-bg:#3A2C10; --bad:#FF7A86; --bad-bg:#3D1922;
  --syl-a:#8EA8FF; --syl-b:#FF8A96; --guide:#26305A; --hl:#5A4B12; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11162D; --line:#1E2647; --line-strong:#2F3B69; --margin:#A9475A;
  --fg:#EEF0FF; --muted:#A5ACD4; --card:#1A2143; --edge:#2A3360; --ink:#8EA8FF; --on-ink:#0E1430;
  --sky:#2A8FD8; --hibiscus:#E04C82; --leaf:#22A35C; --mango:#F08419; --grape:#8462E8; --lagoon:#13A19D; --sun:#F5C53A; --brick:#D9573A;
  --good:#4CD38A; --good-bg:#12392A; --warn:#F2B04A; --warn-bg:#3A2C10; --bad:#FF7A86; --bad-bg:#3D1922;
  --syl-a:#8EA8FF; --syl-b:#FF8A96; --guide:#26305A; --hl:#5A4B12; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--fg);font-family:var(--f-display);font-size:17px;line-height:1.4;
  background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 32px;-webkit-tap-highlight-color:transparent}
#app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:8px 40px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.read{font-family:var(--f-read)}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.1}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* barre du haut */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding-block:10px;background:var(--paper)}
.bar-title{font-size:22px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-icon{width:48px;height:48px;border-radius:14px;background:var(--card);border:2px solid var(--edge);font-size:26px;font-weight:800;display:grid;place-items:center;flex:none;box-shadow:0 3px 0 var(--edge)}
.btn-icon:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);border:2px solid var(--edge);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* boutons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:10px 20px;border-radius:var(--r);font-weight:800;font-size:20px;
  background:var(--c,var(--ink));color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--c,var(--ink)) 62%,#000);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--c,var(--ink)) 62%,#000)}
.btn.ghost{background:var(--card);color:var(--fg);border:2px solid var(--edge);box-shadow:0 4px 0 var(--edge)}
.btn.small{min-height:44px;font-size:17px;padding:6px 14px;border-radius:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-listen{--c:var(--ink)}
:root .btn-listen{color:var(--on-ink)}

/* accueil */
.home-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:10px;flex-wrap:wrap}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-block:18px 8px}
.logo{width:104px;height:104px;border-radius:26px;background:var(--card);border:3px solid var(--ink);display:grid;place-items:center;
  font-family:var(--f-read);font-weight:700;font-size:62px;color:var(--ink);transform:rotate(-4deg);box-shadow:6px 6px 0 var(--sun);position:relative;overflow:hidden}
.logo::before{content:"";position:absolute;left:16px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.7}
.app-name{font-size:clamp(30px,8vw,46px);font-weight:800;color:var(--ink);letter-spacing:.5px}
.tagline{font-size:18px;color:var(--muted);max-width:30ch}
.goal{background:var(--card);border:2px solid var(--edge);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center}
.meter{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .4s}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.home-grid .btn{flex-direction:column;min-height:104px;font-size:17px;gap:4px;text-align:center}
.home-grid .btn .ico{font-size:34px;line-height:1}
.start .sub{display:block;font-size:14px;font-weight:600;opacity:.9}
.start{min-height:78px;font-size:26px;flex-direction:column;gap:0}
.link-parent{align-self:center;color:var(--muted);text-decoration:underline;font-weight:600;padding:8px}

/* niveaux */
.path{display:flex;flex-direction:column;gap:14px}
.lvl{display:flex;align-items:center;gap:14px;padding:12px;border-radius:var(--r);background:var(--card);border:2px solid var(--edge);text-align:left;width:100%}
.lvl .glyph{width:72px;height:72px;border-radius:18px;display:grid;place-items:center;font-family:var(--f-read);font-weight:700;font-size:26px;background:var(--c);color:#fff;flex:none}
.lvl.locked{opacity:.6}
.lvl.locked .glyph{background:var(--muted)}
.lvl .info{flex:1;min-width:0}
.lvl .n{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lvl .name{font-size:22px;font-weight:800}
.stars{letter-spacing:2px;font-size:18px}
.stars .off{filter:grayscale(1);opacity:.35}
.status{font-size:26px}

.lvl-head{display:flex;gap:16px;align-items:center;padding:16px;border-radius:var(--r);background:var(--c);color:#fff}
.lvl-head .glyph{font-family:var(--f-read);font-weight:700;font-size:44px;background:rgba(255,255,255,.2);border-radius:16px;padding:6px 14px}
.tiles3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.tiles3 .btn{min-height:110px;flex-direction:column;font-size:19px}
.tiles3 .btn .ico{font-size:36px}

/* apprentissage des lettres */
.letter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px}
.lt{aspect-ratio:1;border-radius:16px;background:var(--card);border:2px solid var(--edge);font-family:var(--f-read);font-weight:700;font-size:34px;display:grid;place-items:center;position:relative;box-shadow:0 3px 0 var(--edge)}
.lt.vow{color:var(--hibiscus)}
.lt.con{color:var(--ink)}
.lt .tick{position:absolute;top:2px;right:6px;font-size:14px;color:var(--good)}
.card{background:var(--card);border:2px solid var(--edge);border-radius:22px;padding:18px}
.letter-card{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.big-pair{font-family:var(--f-read);font-weight:700;font-size:clamp(90px,28vw,150px);line-height:1;display:flex;gap:.25em;align-items:baseline}
.big-pair .lo{color:var(--hibiscus)}
.media{font-size:86px;line-height:1.1;min-height:96px;display:grid;place-items:center}
.media img{width:120px;height:120px;object-fit:cover;border-radius:18px}
.word-big{font-family:var(--f-read);font-weight:700;font-size:36px;letter-spacing:2px}
.word-big .first{color:var(--hibiscus);text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sound-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.syl-chip{font-family:var(--f-read);font-weight:700;font-size:22px;padding:6px 14px;border-radius:12px;background:var(--paper);border:2px solid var(--edge)}

/* syllabes */
.fusion{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-read);font-weight:700;padding-block:10px;min-height:130px;flex-wrap:wrap}
.tile{display:inline-grid;place-items:center;min-width:76px;height:84px;padding:0 10px;border-radius:16px;background:var(--card);border:3px solid var(--edge);font-size:48px;font-family:var(--f-read);font-weight:700}
.tile.c{color:var(--ink);border-color:var(--ink)}
.tile.v{color:var(--hibiscus);border-color:var(--hibiscus)}
.tile.res{min-width:120px;background:var(--hl);border-color:var(--sun)}
.tile.empty{color:var(--muted);border-style:dashed}
.op{font-size:36px;color:var(--muted)}
.fusion .tile{min-width:64px;height:78px;font-size:42px}
.fusion .tile.res{min-width:96px}
.fusion.go .c{animation:slideR .7s ease both}
.fusion.go .v{animation:slideL .7s ease both}
.fusion.go .res{animation:pop .5s .7s ease both}
@keyframes slideR{0%{transform:translateX(0)}60%{transform:translateX(26px)}100%{transform:translateX(0)}}
@keyframes slideL{0%{transform:translateX(0)}60%{transform:translateX(-26px)}100%{transform:translateX(0)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tab{padding:8px 16px;border-radius:999px;border:2px solid var(--edge);background:var(--card);font-weight:800;font-size:18px;white-space:nowrap;font-family:var(--f-read)}
.tab.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.syl-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.syl-btn{min-height:70px;border-radius:16px;background:var(--card);border:2px solid var(--edge);font-family:var(--f-read);font-weight:700;font-size:30px;box-shadow:0 3px 0 var(--edge)}
.syl-btn:active{transform:translateY(2px)}
.syl-btn.lit{background:var(--hl);border-color:var(--sun)}
.syl-btn .c{color:var(--ink)}.syl-btn .v{color:var(--hibiscus)}

/* mots et phrases */
.word-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.wcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:16px;background:var(--card);border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge)}
.wcard .emo{font-size:40px}.wcard img{width:52px;height:52px;object-fit:cover;border-radius:10px}
.wcard .w{font-family:var(--f-read);font-weight:700;font-size:20px;max-width:100%;overflow-wrap:anywhere}
.syls{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-family:var(--f-read);font-weight:700;font-size:clamp(40px,11vw,60px)}
.syl{padding:2px 6px;border-radius:12px;transition:background .2s}
.syl.s0{color:var(--syl-a)}.syl.s1{color:var(--syl-b)}
.syl.lit,.pw.lit{background:var(--hl)}
.sep{color:var(--muted);font-weight:400}
.phrase{font-family:var(--f-read);font-size:clamp(28px,7.5vw,40px);line-height:1.5;display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center}
.pw{border-radius:10px;padding:0 4px}
.pw .s0{color:var(--syl-a)}.pw .s1{color:var(--syl-b)}
.legend{font-size:14px;color:var(--muted);text-align:center}
:root[data-dir="rtl"] :is(.syls,.phrase,.word-big,.fusion,.slots,.pool,.big-pair,.visual-text,.syl-btn,.strip,.word-list .w,.sound-row,.review-chips){direction:rtl}
:root[data-dir="rtl"] .letter-grid{direction:rtl}

/* exercices */
.ex-top{display:flex;align-items:center;gap:10px;padding-block:10px}
.dots{flex:1;display:flex;gap:4px}
.dots i{flex:1;height:10px;border-radius:99px;background:var(--line-strong)}
.dots i.done{background:var(--leaf)}.dots i.miss{background:var(--bad)}.dots i.cur{background:var(--sun)}
.prompt{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800}
.prompt .btn-icon{background:var(--ink);color:var(--on-ink);border-color:var(--ink);box-shadow:0 3px 0 color-mix(in srgb,var(--ink) 60%,#000)}
.visual{display:grid;place-items:center;min-height:150px;padding-block:8px}
.big-letter{font-family:var(--f-read);font-weight:700;font-size:clamp(100px,30vw,150px);line-height:1}
.speaker{width:150px;height:150px;border-radius:50%;background:var(--ink);color:var(--on-ink);font-size:70px;display:grid;place-items:center;box-shadow:0 6px 0 color-mix(in srgb,var(--ink) 60%,#000);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.visual-text{font-family:var(--f-read);font-weight:700;font-size:44px;text-align:center}
.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{min-height:96px;border-radius:20px;background:var(--card);border:3px solid var(--edge);font-family:var(--f-read);font-weight:700;font-size:44px;box-shadow:0 5px 0 var(--edge);overflow-wrap:anywhere;padding:6px}
.opt.wordopt{font-size:28px}
.opt.emoopt{font-size:38px;line-height:1.2}
.opt img{width:72px;height:72px;object-fit:cover;border-radius:12px}
.opt:active{transform:translateY(3px)}
.opt.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.ko{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);opacity:.7}
.opt.sel{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 14%,var(--card))}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.multi{grid-template-columns:repeat(4,1fr)}
.multi .opt{min-height:78px;font-size:40px}
.slots,.pool{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.slot{min-width:84px;height:84px;border-radius:16px;border:3px dashed var(--line-strong);display:grid;place-items:center;font-family:var(--f-read);font-weight:700;font-size:38px;padding:0 10px}
.slot.full{border-style:solid;border-color:var(--ink);background:var(--card)}
.pool .opt{min-width:84px;min-height:78px;font-size:36px;padding:0 14px}
.pool .opt.used{visibility:hidden}
.feedback{min-height:40px;text-align:center;font-size:24px;font-weight:800}
.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}

/* résultat */
.result{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding-block:24px}
.result .big{font-size:64px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.result .stars{font-size:52px}

/* écriture */
.trace-stage{position:relative;width:100%;max-width:100%;margin:0 auto;border-radius:20px;overflow:hidden;border:2px solid var(--edge);background:var(--card);touch-action:none}
.trace-stage canvas{position:absolute;inset:0;width:100%;height:100%}
.trace-stage .cv-ink{touch-action:none;cursor:crosshair}
.verdict{text-align:center;font-size:24px;font-weight:800;padding:10px;border-radius:16px;min-height:52px}
.verdict.good{background:var(--good-bg);color:var(--good)}.verdict.warn{background:var(--warn-bg);color:var(--warn)}.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.strip button{min-width:52px;height:52px;border-radius:12px;border:2px solid var(--edge);background:var(--card);font-family:var(--f-read);font-weight:700;font-size:24px;padding:0 10px;flex:none}
.strip button.on{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.strip button .g{font-size:12px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tools .btn{min-height:54px;font-size:16px;padding:6px;line-height:1.1;text-align:center}

/* progression, récompenses */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--card);border:2px solid var(--edge);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat span{font-size:14px;color:var(--muted);font-weight:600}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--card);border:2px solid var(--edge)}
.li .grow{font-weight:700}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:14px 8px;border-radius:18px;background:var(--card);border:2px solid var(--edge)}
.badge .b-ico{font-size:44px}
.badge.off .b-ico{filter:grayscale(1);opacity:.35}
.badge.off{color:var(--muted)}
.badge b{font-size:16px}.badge small{font-size:13px;color:var(--muted)}
.streak{display:flex;align-items:center;gap:16px;padding:16px;border-radius:var(--r);background:var(--card);border:2px solid var(--edge)}
.streak .flame{font-size:56px}
.streak b{font-size:40px;font-weight:800;color:var(--mango)}
.section-title{font-size:20px;font-weight:800;margin-top:6px}
.review-chips{display:flex;flex-wrap:wrap;gap:8px}

/* formulaires */
label.field{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:15px}
input[type=text],input[type=number],input[type=password],select,textarea{font:inherit;font-size:17px;padding:10px 12px;border-radius:12px;border:2px solid var(--edge);background:var(--card);color:var(--fg);width:100%;min-width:0}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:13px;min-height:140px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:2px solid var(--edge);font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:12px;border:2px solid var(--edge);background:var(--card);font-weight:700}
.seg button.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.tbl-wrap{overflow-x:auto;border:2px solid var(--edge);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--edge);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td input[type=text]{padding:6px 8px;font-size:15px;min-width:90px}
td .emo{font-size:26px}
td img{width:36px;height:36px;object-fit:cover;border-radius:8px;vertical-align:middle}
.filebtn{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:10px;border:2px solid var(--edge);font-size:14px;font-weight:700;cursor:pointer;background:var(--paper)}
.filebtn input{display:none}
.has{color:var(--good)}
.pin-dots{display:flex;gap:14px;justify-content:center;font-size:34px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:320px;margin:0 auto}
.keypad button{height:70px;border-radius:18px;background:var(--card);border:2px solid var(--edge);font-size:30px;font-weight:800;box-shadow:0 3px 0 var(--edge)}
.avatars{display:flex;gap:8px;flex-wrap:wrap}
.avatars button{font-size:34px;width:58px;height:58px;border-radius:14px;border:2px solid var(--edge);background:var(--card)}
.avatars button.on{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 14%,var(--card))}
.note{font-size:14px;color:var(--muted)}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-display)}

/* toast, modale, confettis */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(140%);background:var(--fg);color:var(--paper);padding:12px 18px;border-radius:16px;font-weight:700;font-size:17px;max-width:calc(100% - 32px);text-align:center;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none;z-index:50}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,35,.55);display:grid;place-items:center;padding:16px;z-index:60}
.modal{background:var(--card);border-radius:22px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
.confetti{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:70;pointer-events:none;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.fade-in{animation:fadein .25s ease both}
@keyframes fadein{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.options{gap:10px}.opt{font-size:38px;min-height:84px}.syl-grid{gap:6px}.syl-btn{font-size:24px}}
</style>

function parsePhrase(p){ const toks=p.src.trim().split(/\s+/); return toks.map(t=>{ const m=t.match(/^(.*?)([.,!?;:]*)$/); return {syl:m[1].split('-'), punct:m[2], word:m[1].replace(/-/g,'')}; }); }

/* ---------- 3. AUDIO ---------- */
// Clés audio : L:A (nom de la lettre) · LS:A (son) · LW:A (mot exemple) · S:MA (syllabe) · W:MAMAN (mot) · P:p1 (phrase)
// Chaque clé peut pointer vers un fichier (« audio/fr/lettres/a.mp3 ») ou un son importé dans l’administration.
let VOICE=null, CUR_AUDIO=null, speakTok=0;
const hasTTS = 'speechSynthesis' in window;
function pickVoice(){ if(!hasTTS) return; const vs=speechSynthesis.getVoices(); VOICE = vs.find(v=>/^fr[-_]FR/i.test(v.lang)&&/google|natural|premium|enhanced/i.test(v.name)) || vs.find(v=>/^fr[-_]FR/i.test(v.lang)) || vs.find(v=>/^fr/i.test(v.lang)) || null; }
if(hasTTS){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
const A = (key,text) => ({key,text});
function stopSpeech(){ speakTok++; try{ hasTTS&&speechSynthesis.cancel(); }catch(e){} if(CUR_AUDIO){ try{CUR_AUDIO.pause();}catch(e){} CUR_AUDIO=null; } }
function ttsOne(text){ return new Promise(res=>{ if(!S.sound||!text||!hasTTS) return res(); const u=new SpeechSynthesisUtterance(text); u.lang='fr-FR'; if(VOICE) u.voice=VOICE; u.rate=S.rate; let done=false; const fin=()=>{ if(!done){done=true;res();} }; u.onend=fin; u.onerror=fin; setTimeout(fin,1800+text.length*170/S.rate); speechSynthesis.speak(u); }); }
function fileOne(src,fallback){ return new Promise(res=>{ if(!S.sound) return res(); const a=new Audio(src); CUR_AUDIO=a; let done=false; const fin=()=>{ if(!done){done=true;res();} }; a.onended=fin; a.onerror=()=>{ if(!done){ done=true; ttsOne(fallback).then(res); } }; a.play().catch(()=>{ if(!done){ done=true; ttsOne(fallback).then(res); } }); }); }
async function say(parts, onStep){ stopSpeech(); const tok=speakTok; await wait(40); parts=[].concat(parts);
  for(let i=0;i<parts.length;i++){ if(tok!==speakTok) return; const p=parts[i]; if(p==null) continue; onStep&&onStep(i);
    if(typeof p==='number'){ await wait(p); continue; }
    if(typeof p==='object'){ const src=await resolveAudio(p.key); if(tok!==speakTok) return; if(src) await fileOne(src,p.text); else await ttsOne(p.text); }
    else await ttsOne(p); }
  if(tok===speakTok) onStep&&onStep(-1); }

/* ---------- 3b. SONS STOCKÉS SUR L’APPAREIL ----------
   Trois sources, dans cet ordre :
   1) C.audio[clé] = 'idb'  → son enregistré au micro ou importé, gardé dans IndexedDB (base « jal-media »)
   2) C.audio[clé] = chemin ou data: URL (anciennes versions)
   3) SERVER_AUDIO[clé]     → fichiers déposés sur le serveur dans audio/<langue>/ et listés dans audio/<langue>/index.json
   Sinon : synthèse vocale du téléphone. */
const AudioDB = {
  db:null,
  open(){ if(this.db) return Promise.resolve(this.db); return new Promise((res,rej)=>{ try{ const r=indexedDB.open('jal-media',1); r.onupgradeneeded=()=>r.result.createObjectStore('audio'); r.onsuccess=()=>{ this.db=r.result; res(this.db); }; r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); },
  async run(mode, fn){ const db=await this.open(); return new Promise((res,rej)=>{ const tx=db.transaction('audio',mode); const st=tx.objectStore('audio'); const rq=fn(st); tx.oncomplete=()=>res(rq&&rq.result); tx.onerror=()=>rej(tx.error); }); },
  put(k,blob){ return this.run('readwrite',st=>st.put(blob,k)); },
  get(k){ return this.run('readonly',st=>st.get(k)); },
  del(k){ return this.run('readwrite',st=>st.delete(k)); }
};
const URLS = {}; let SERVER_AUDIO = {};
const idbKey = key => S.contentLang+':'+key;
async function resolveAudio(key){ const v=C.audio[key];
  if(v==='idb'){ if(URLS[key]) return URLS[key]; try{ const b=await AudioDB.get(idbKey(key)); if(b){ URLS[key]=URL.createObjectURL(b); return URLS[key]; } }catch(e){} return SERVER_AUDIO[key]||null; }
  return v || SERVER_AUDIO[key] || null; }
const hasAudio = key => !!(C.audio[key] || SERVER_AUDIO[key]);
const blobToDataURL = b => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(b); });
async function storeAudio(key, blob){
  try{ await AudioDB.put(idbKey(key), blob); C.audio[key]='idb'; }
  catch(e){ if(blob.size>450000) throw new Error('Mémoire indisponible pour ce son.'); C.audio[key]=await blobToDataURL(blob); }
  if(URLS[key]){ URL.revokeObjectURL(URLS[key]); delete URLS[key]; } saveContent(); }
async function removeAudio(key){ try{ await AudioDB.del(idbKey(key)); }catch(e){} if(URLS[key]){ URL.revokeObjectURL(URLS[key]); delete URLS[key]; } delete C.audio[key]; saveContent(); }
async function loadServerAudio(){ if(!/^https?:$/.test(location.protocol) || !window.JAL_PWA) return; try{ const r=await fetch(`audio/${S.contentLang}/index.json`,{cache:'no-cache'}); if(r.ok){ SERVER_AUDIO=await r.json(); } }catch(e){} }
// Enregistrement au micro (fonctionne dans l’application installée / ouverte en https)
const Rec = {
  mr:null, stream:null, chunks:[], timer:null,
  supported(){ return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder); },
  async start(onAuto){ this.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    this.chunks=[]; this.mr=new MediaRecorder(this.stream); this.mr.ondataavailable=e=>{ if(e.data.size) this.chunks.push(e.data); };
    this.stopped=new Promise(r=>this.mr.onstop=r); this.mr.start(); this.t0=Date.now(); this.timer=setTimeout(()=>onAuto&&onAuto(),10000); },
  async stop(){ clearTimeout(this.timer); if(!this.mr) return null; const type=this.mr.mimeType||'audio/webm'; if(this.mr.state!=='inactive') this.mr.stop(); await this.stopped; this.stream.getTracks().forEach(t=>t.stop()); this.mr=null; return new Blob(this.chunks,{type}); },
  cancel(){ clearTimeout(this.timer); try{ this.mr&&this.mr.state!=='inactive'&&this.mr.stop(); }catch(e){} try{ this.stream&&this.stream.getTracks().forEach(t=>t.stop()); }catch(e){} this.mr=null; }
};
let AC=null;
function tone(fs,dur=.1,type='sine',gain=.12){ if(!S.sound) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const t=AC.currentTime; fs.forEach((f,i)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=f; const s=t+i*dur; g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(gain,s+.01); g.gain.exponentialRampToValueAtTime(.001,s+dur*1.8); o.connect(g).connect(AC.destination); o.start(s); o.stop(s+dur*2); }); }catch(e){} }
const sfxGood=()=>tone([660,880,1320],.09,'triangle'), sfxBad=()=>tone([240,180],.14,'square',.05), sfxWin=()=>tone([523,659,784,1046,1318],.11,'triangle');

const letterSay = L => L.word ? [aLetter(L),300,'comme',aWordOfLetter(L)] : [aLetter(L)];
const aSound = L => L.sound ? A('LS:'+L.u, L.sound) : 'La lettre h ne fait pas de bruit.';
const aSyll = s => A('S:'+s.s, s.say);
const aWord = W => A('W:'+W.w, W.tr||W.w.toLowerCase());

/* ---------- 4. PROGRESSION ---------- */
const levelState = id => P.levels[id] || (P.levels[id]={best:0,stars:0,passed:false,attempts:0,practice:0});
const isUnlocked = i => S.unlockAll || i===0 || !!P.levels[LEVELS[i-1].id]?.passed;
const currentLevel = () => { for(let i=0;i<LEVELS.length;i++){ if(isUnlocked(i)&&!P.levels[LEVELS[i].id]?.passed) return i; } return LEVELS.length-1; };
const totalStars = () => LEVELS.reduce((s,l)=>s+(P.levels[l.id]?.stars||0),0);
const passedCount = () => LEVELS.filter(l=>P.levels[l.id]?.passed).length;
function streak(){ let n=0; const d=new Date(); const active=k=>{ const x=P.daily[k]; return x&&(x.ex>0||x.learned>0); };
  if(!active(dayKey(d))) d.setDate(d.getDate()-1);
  while(active(dayKey(d))){ n++; d.setDate(d.getDate()-1); } return n; }
function record(key, ok){ const it=P.items[key]||(P.items[key]={ok:0,ko:0}); ok?it.ok++:it.ko++; it.last=ok?1:0; it.at=Date.now();
  if(ok){ P.ok++; P.points+=10; const d=day(); d.correct++; d.ex++; if(d.correct===S.dailyGoal){ setTimeout(()=>{ toast('🎯 Objectif du jour atteint ! Bravo !'); },900); award('goal'); } award('first'); if(it.ok>=2&&it.last) delete P.review[key]; }
  else { P.ko++; day().ex++; P.review[key]=1; }
  checkBadges(); saveProg(); }
function markLearned(key){ if(P.learned[key]) return; P.learned[key]=today(); const d=day(); d.learned++;
  const n=Object.entries(P.learned).filter(([k,v])=>v===today()&&k.startsWith('L:')).length;
  if(key.startsWith('L:') && (n===5||n===10||n===20)){ setTimeout(()=>{ toast(`Bravo ! Tu as appris ${n} nouvelles lettres aujourd’hui ! 🎉`,3400); confetti(); },500); }
  checkBadges(); saveProg(); }
function award(id){ if(P.badges[id]) return false; P.badges[id]=today(); const b=BADGES.find(x=>x.id===id); if(b) setTimeout(()=>toast(`${b.ico} Nouveau badge : ${b.name}`,3000),1400); saveProg(); return true; }
function checkBadges(){ const nL=Object.keys(P.learned).filter(k=>k.startsWith('L:')).length; if(nL>=10) award('letters10');
  LEVELS.forEach(l=>{ if(P.levels[l.id]?.passed) award(l.id); });
  if(P.goodTraces>=5) award('traces5'); const s=streak(); if(s>=3) award('streak3'); if(s>=7) award('streak7'); if(totalStars()>=10) award('stars10'); }

   <button class="btn" style="--c:var(--leaf)" data-act="practice" data-arg="${i}"><span class="ico">🧩</span>S’exercer</button>
   ${L.read?`<button class="btn" style="--c:var(--grape)" data-act="readAloud" data-arg="${i}"><span class="ico">🗣️</span>Lire à voix haute</button>`:''}
   <button class="btn" style="--c:var(--mango)" data-act="quiz" data-arg="${i}"><span class="ico">🏁</span>Quiz final</button>
  </div>
  <p class="note">Réussis le quiz final avec au moins ${S.threshold} % pour ouvrir le niveau suivant.</p></div>`; };
ACT.learn = a => { const L=LEVELS[+a]; go(L.learn==='writing'?'write':'learn_'+L.learn,{i:+a}); };
ACT.practice = a => startSession(+a,'practice');
ACT.quiz = a => startSession(+a,'quiz');

/* ----- Apprendre : lettres / voyelles / consonnes ----- */
function letterLearn(pool, kind){ return p => { const list=pool(); if(p.d==null) return `${topbar(kind==='vowels'?'Les voyelles':kind==='consonants'?'Les consonnes':'L’alphabet')}<div class="stack fade-in">
   ${kind==='vowels'?`<div class="card stack" style="align-items:center;text-align:center"><b style="font-size:20px">Les voyelles chantent !</b><div class="syls" id="vowel-song">${list.map((L,k)=>`<span class="syl s${k%2}" data-k="${k}">${esc(L.l)}</span>`).join('')}</div><button class="btn btn-listen small" data-act="singVowels">🔊 ÉCOUTER</button></div>`:''}
   ${kind==='consonants'?`<p class="muted">Chaque consonne a un <b>nom</b> et un <b>son</b>. Avec une voyelle, elle forme une syllabe.</p>`:''}
   <div class="letter-grid">${list.map((L,k)=>`<button class="lt ${L.vowel?'vow':'con'}" data-act="openLetter" data-arg="${k}" aria-label="Lettre ${esc(L.u)}">${esc(L.u)}${P.learned['L:'+L.u]?'<span class="tick">✓</span>':''}</button>`).join('')}</div>
   <button class="btn" style="--c:var(--leaf)" data-act="practice" data-arg="${p.i}">🧩 Je m’exerce</button></div>`;
  const L=list[p.d]; const combos = !L.vowel && L.sound ? C.vowels.map(v=>({s:L.u+v,c:L.u,v,say:syllSay(L.u,v)})) : [];
  return `${topbar(`Lettre ${esc(L.u)}`)}<div class="stack fade-in"><div class="card letter-card">
   <div class="big-pair"><span>${esc(L.u)}</span>${C.noCase?'':`<span class="lo">${esc(L.l)}</span>`}</div>
   ${L.word?`<div class="media">${media(L)}</div>
   <div class="word-big">${firstLetterMark(L.word,L.u)}</div>${L.wordSay?`<div class="note">${esc(L.wordSay)}</div>`:''}`:`<div class="note">se lit : « ${esc(L.name)} »</div>`}
   <div class="sound-row"><button class="btn btn-listen" data-act="sayLetter" data-arg="${p.d}">🔊 ÉCOUTER</button>
    ${!L.vowel?`<button class="btn" style="--c:var(--leaf)" data-act="saySound" data-arg="${p.d}">👄 LE SON</button>`:''}</div>
   ${combos.length?`<div class="sound-row">${combos.map(s=>`<button class="syl-chip" data-act="saySyl" data-arg="${s.s}">${esc(wcase(s.s))}</button>`).join('')}</div>`:''}
   ${L.vowel?`<span class="chip" style="color:var(--hibiscus)">C’est une voyelle</span>`:`<span class="chip" style="color:var(--ink)">C’est une consonne</span>`}
  </div><div class="pager"><button class="btn ghost small" data-act="letterNav" data-arg="-1" ${p.d===0?'disabled':''}>‹ Avant</button><span class="muted">${p.d+1} / ${list.length}</span><button class="btn ghost small" data-act="letterNav" data-arg="1" ${p.d===list.length-1?'disabled':''}>Après ›</button></div></div>`; }; }
function firstLetterMark(word,u){ const w=wcase(word); return `<span class="first">${esc(w[0])}</span>${esc(w.slice(1))}`; }
const learnPool = () => ({learn_letters:letters, learn_vowels:vowels, learn_consonants:consonants})[CUR.name]();
SCREENS.learn_letters = letterLearn(letters,'letters');
SCREENS.learn_vowels = letterLearn(vowels,'vowels');
SCREENS.learn_consonants = letterLearn(consonants,'consonants');
const onLetterOpen = p => { if(p.d==null) return; const L=learnPool()[p.d]; markLearned('L:'+L.u); say(letterSay(L)); };
AFTER.learn_letters=AFTER.learn_vowels=AFTER.learn_consonants=onLetterOpen;
ACT.openLetter = a => { CUR.params.d=+a; NAV.push({name:CUR.name,params:{i:CUR.params.i}}); render(true); };
ACT.letterNav = a => { CUR.params.d=Math.max(0,Math.min(learnPool().length-1,CUR.params.d+ +a)); render(true); };
ACT.sayLetter = a => { const L=learnPool()[+a]; say(letterSay(L)); };
ACT.saySound = a => { const L=learnPool()[+a]; say([L.sound?`La lettre ${L.name} fait`:null, aSound(L), 250, L.sound||null]); };
ACT.saySyl = a => { const s=syllables().find(x=>x.s===a) || {s:a,say:syllSay(a[0],a.slice(1))}; say([aSyll(s)]); };
ACT.singVowels = () => { const els=$$('#vowel-song .syl'); say(vowels().flatMap(L=>[aLetter(L),150]), i=>{ els.forEach(e=>e.classList.remove('lit')); if(i>=0&&i%2===0) els[i/2]?.classList.add('lit'); }); vowels().forEach(L=>markLearned('L:'+L.u)); };

/* ----- Apprendre : syllabes ----- */
SCREENS.learn_syllables = p => { const fam=p.f||C.families[0]; const list=C.vowels.map(v=>({s:fam+v,c:fam,v,say:syllSay(fam,v)})); const cur=p.s?list.find(x=>x.s===p.s)||list[0]:list[0];
 return `${topbar('Les syllabes')}<div class="stack fade-in">
  <div class="tabs" role="tablist">${C.families.map(f=>`<button class="tab ${f===fam?'on':''}" data-act="famTab" data-arg="${f}">${esc(wcase(f))}</button>`).join('')}</div>
  <div class="card"><div class="fusion" id="fusion"><span class="tile c">${esc(wcase(cur.c))}</span><span class="op">+</span><span class="tile v">${esc(wcase(cur.v))}</span><span class="op">=</span><span class="tile res">${esc(wcase(cur.s))}</span></div>
   <p class="legend">Deux lettres qui se donnent la main forment une syllabe.</p></div>
  <div class="syl-grid">${list.map(s=>`<button class="syl-btn" data-act="pickSyl" data-arg="${s.s}"><span class="c">${esc(wcase(s.c))}</span><span class="v">${esc(wcase(s.v))}</span></button>`).join('')}</div>
  <button class="btn btn-listen" data-act="famAll">🔊 ÉCOUTER LA FAMILLE ${esc(wcase(fam))}</button>
  <div class="tiles3"><button class="btn" style="--c:var(--grape)" data-act="readAloud" data-arg="${p.i}">🗣️ Lire à voix haute</button><button class="btn" style="--c:var(--leaf)" data-act="practice" data-arg="${p.i}">🧩 Je m’exerce</button></div></div>`; };
ACT.famTab = a => { CUR.params.f=a; CUR.params.s=null; rerender(); };
ACT.pickSyl = a => { CUR.params.s=a; rerender(); const s={s:a,c:a[0],v:a.slice(1),say:syllSay(a[0],a.slice(1))}; const L=letterBy(s.c), V=letterBy(s.v); const f=$('#fusion'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); markLearned('S:'+a);
  say([L?aSound(L):null, 200, V?aLetter(V):null, 350, aSyll(s)]); };
ACT.famAll = () => { const fam=CUR.params.f||C.families[0]; const btns=$$('.syl-btn'); say(C.vowels.flatMap(v=>[aSyll({s:fam+v,say:syllSay(fam,v)}),200]), i=>{ btns.forEach(b=>b.classList.remove('lit')); if(i>=0&&i%2===0) btns[i/2]?.classList.add('lit'); }); };

/* ----- Apprendre : mots ----- */
const sylSpans = (W,id='') => W.syl.map((s,k)=>`<button class="syl s${k%2}" data-act="sayWSyl" data-arg="${k}" ${id?`data-w="${id}"`:''}>${esc(wcase(s))}</button>`).join('<span class="sep">-</span>');
SCREENS.learn_words = p => { if(p.d==null) return `${topbar('Les mots')}<div class="stack fade-in"><p class="muted">Touche un mot pour le lire syllabe par syllabe.</p>
  <div class="word-list">${C.words.map((W,k)=>`<button class="wcard" data-act="openWord" data-arg="${k}">${media(W)}<span class="w">${esc(wcase(W.w))}</span>${P.learned['W:'+W.w]?'<span class="has">✓</span>':''}</button>`).join('')}</div>
  <div class="tiles3"><button class="btn" style="--c:var(--grape)" data-act="readAloud" data-arg="${p.i}">🗣️ Lire à voix haute</button><button class="btn" style="--c:var(--leaf)" data-act="practice" data-arg="${p.i}">🧩 Je m’exerce</button></div></div>`;
 const W=C.words[p.d]; return `${topbar(esc(wcase(W.w)))}<div class="stack fade-in"><div class="card letter-card"><div class="media">${media(W)}</div>
   <div class="syls" id="wsyls">${sylSpans(W)}</div>${W.tr?`<p class="note">${esc(W.tr)}${W.fr?' — '+esc(W.fr):''}</p>`:''}<p class="legend">Une couleur par syllabe. Touche chaque syllabe pour l’entendre.</p>
   <button class="btn btn-listen" data-act="readWord">🔊 LIRE LE MOT</button></div>
   <div class="pager"><button class="btn ghost small" data-act="wordNav" data-arg="-1" ${p.d===0?'disabled':''}>‹ Avant</button><span class="muted">${p.d+1} / ${C.words.length}</span><button class="btn ghost small" data-act="wordNav" data-arg="1" ${p.d===C.words.length-1?'disabled':''}>Après ›</button></div></div>`; };
AFTER.learn_words = p => { if(p.d!=null){ markLearned('W:'+C.words[p.d].w); ACT.readWord(); } };
ACT.openWord = a => { CUR.params.d=+a; NAV.push({name:CUR.name,params:{i:CUR.params.i}}); render(true); };
ACT.wordNav = a => { CUR.params.d=Math.max(0,Math.min(C.words.length-1,CUR.params.d+ +a)); render(true); };
ACT.sayWSyl = (a,el) => { const W = el.dataset.w!=null ? C.words[+el.dataset.w] : (CUR.params.word || C.words[CUR.params.d]); say([A('W:'+W.w+':'+a, W.say?.[+a]||W.syl[+a].toLowerCase())]); };
ACT.readWord = () => { const W=CUR.params.word||C.words[CUR.params.d]; const els=$$('#wsyls .syl'); const parts=W.syl.flatMap((s,k)=>[A('W:'+W.w+':'+k, W.say?.[k]||s.toLowerCase()),250]); parts.push(400, aWord(W));
  say(parts, i=>{ els.forEach(e=>e.classList.remove('lit')); if(i>=0&&i<W.syl.length*2&&i%2===0) els[i/2]?.classList.add('lit'); if(i===parts.length-1) els.forEach(e=>e.classList.add('lit')); }); };

/* ----- Apprendre : phrases / lecture ----- */
const phraseHtml = (p, id) => `<div class="phrase" id="${id}">${parsePhrase(p).map((w,k)=>`<button class="pw" data-act="sayPW" data-arg="${k}" data-p="${esc(p.id)}">${w.syl.map((s,j)=>`<span class="s${j%2}">${esc(s)}</span>`).join('')}${esc(w.punct)}</button>`).join('')}</div>`;
SCREENS.learn_phrases = p => { const k=p.d||0, ph=C.phrases[k]; return `${topbar('Lecture')}<div class="stack fade-in">
  <div class="card letter-card"><div class="media">${ph.img?`<img src="${ph.img}" alt="">`:`<span>${ph.emoji||''}</span>`}</div>${phraseHtml(ph,'phr')}${ph.tr?`<p class="note">${esc(ph.tr)}${ph.fr?' — '+esc(ph.fr):''}</p>`:''}
  <p class="legend">Les couleurs montrent les syllabes. Touche un mot pour l’entendre.</p>
  <button class="btn btn-listen" data-act="readPhrase">🔊 ÉCOUTER LA PHRASE</button></div>
  <div class="pager"><button class="btn ghost small" data-act="phrNav" data-arg="-1" ${k===0?'disabled':''}>‹ Avant</button><span class="muted">${k+1} / ${C.phrases.length}</span><button class="btn ghost small" data-act="phrNav" data-arg="1" ${k===C.phrases.length-1?'disabled':''}>Après ›</button></div>
  <div class="tiles3"><button class="btn" style="--c:var(--grape)" data-act="readAloud" data-arg="${p.i}">🗣️ Lire à voix haute</button><button class="btn" style="--c:var(--leaf)" data-act="practice" data-arg="${p.i}">🧩 Je m’exerce</button></div></div>`; };
AFTER.learn_phrases = p => markLearned('P:'+C.phrases[p.d||0].id);
ACT.phrNav = a => { CUR.params.d=Math.max(0,Math.min(C.phrases.length-1,(CUR.params.d||0)+ +a)); render(true); };
ACT.sayPW = (a,el) => { const ph=C.phrases.find(x=>x.id===el.dataset.p); const w=parsePhrase(ph)[+a]; say([A('PW:'+ph.id+':'+a, phraseWordSay(ph,+a,w))]); };
ACT.readPhrase = () => { const ph=CUR.params.phrase||C.phrases[CUR.params.d||0]; const ws=parsePhrase(ph); const els=$$('#phr .pw');
  const parts=ws.flatMap((w,k)=>[A('PW:'+ph.id+':'+k, phraseWordSay(ph,k,w)),120]); parts.push(500, A('P:'+ph.id, ph.tr||phraseText(ph)));
  say(parts, i=>{ els.forEach(e=>e.classList.remove('lit')); if(i>=0&&i<ws.length*2&&i%2===0) els[i/2]?.classList.add('lit'); }); };

/* ----- Lire à voix haute (auto-évaluation : exercices 10 et 11) ----- */
ACT.readAloud = a => { const L=LEVELS[+a]; let items=[];
  if(L.read==='syll') items=shuffle(syllables()).slice(0,6).map(s=>({key:'S:'+s.s, html:`<div class="syls"><span class="syl s0">${esc(wcase(s.s))}</span></div>`, audio:[aSyll(s)]}));
  if(L.read==='word') items=shuffle(C.words).slice(0,5).map(W=>({key:'W:'+W.w, word:W, html:`<div class="syls" id="wsyls">${sylSpans(W)}</div>`, audio:null}));
  if(L.read==='phrase') items=shuffle(C.phrases).slice(0,3).map(ph=>({key:'P:'+ph.id, phrase:ph, html:phraseHtml(ph,'phr'), audio:null}));
  go('read',{i:+a, items, k:0, heard:false}); };
SCREENS.read = p => { const it=p.items[p.k]; return `${topbar('Lire à voix haute')}<div class="stack fade-in">
  <div class="dots">${p.items.map((_,j)=>`<i class="${j<p.k?'done':j===p.k?'cur':''}"></i>`).join('')}</div>
  <div class="prompt">🗣️ <span>Lis à voix haute, puis écoute pour vérifier.</span></div>
  <div class="card visual">${it.html}</div>
  <button class="btn btn-listen" data-act="readCheck">🔊 ÉCOUTER POUR VÉRIFIER</button>
  ${p.heard?`<div class="row"><button class="btn grow" style="--c:var(--good)" data-act="readSelf" data-arg="1">👍 J’ai bien lu</button><button class="btn grow" style="--c:var(--warn)" data-act="readSelf" data-arg="0">🔁 À revoir</button></div>`:''}</div>`; };
AFTER.read = p => { const it=p.items[p.k]; CUR.params.word=it.word; CUR.params.phrase=it.phrase; };
ACT.readCheck = () => { const p=CUR.params, it=p.items[p.k]; if(it.word) ACT.readWord(); else if(it.phrase) ACT.readPhrase(); else say(it.audio); if(!p.heard){ p.heard=true; const y=scrollY; rerender(); scrollTo(0,y); } };
ACT.readSelf = a => { const p=CUR.params, it=p.items[p.k]; record('R:'+it.key, a==='1'); if(a==='1'){ sfxGood(); say([pick(PRAISE)]); } if(p.k<p.items.length-1){ p.k++; p.heard=false; render(true); } else { toast('Lecture terminée. Bravo ! 🎉'); back(); } };

/* ----- Générateurs d’exercices ----- */
function choices(list, correct, n, key=x=>x){ const others=shuffle(list.filter(x=>key(x)!==key(correct))); const uniq=[]; const seen=new Set([key(correct)]); for(const o of others){ if(!seen.has(key(o))){ seen.add(key(o)); uniq.push(o); } if(uniq.length>=n-1) break; } return shuffle([correct,...uniq]); }
const letterOpt = (L,low) => ({v:L.u, html:esc(low?L.l:L.u)});
const speakerVisual = `<button class="speaker" data-act="replay" aria-label="Réécouter">🔊</button>`;
function listenGen(pool, label){ const L=pick(pool()); return {key:'L:'+L.u, prompt:`Écoute et touche la bonne ${label}.`, say:[`Écoute et touche la bonne ${label}.`, 200, aLetter(L)], replay:[aLetter(L)], visual:speakerVisual, kind:'choice', options:choices(pool().length>=4?pool():letters(),L,4,x=>x.u).map(x=>letterOpt(x)), answer:L.u}; }
function imageGen(pool0){ const pool=()=>pool0().filter(x=>x.word); const L=pick(pool()); return {key:'LW:'+L.u, prompt:'Par quelle lettre commence ce mot ?', say:['Par quelle lettre commence', aWordOfLetter(L), '?'], replay:[aWordOfLetter(L)], visual:`<div class="media">${media(L)}</div>`, kind:'choice', options:choices(pool().length>=4?pool():letters(),L,4,x=>x.u).map(x=>letterOpt(x)), answer:L.u}; }
const G = {
 matchCase(){ const L=pick(letters()); return {key:'L:'+L.u, prompt:'Trouve la petite lettre.', say:['Trouve la petite lettre de', aLetter(L)], replay:[aLetter(L)], visual:`<div class="big-letter">${esc(L.u)}</div>`, kind:'choice', options:choices(letters(),L,4,x=>x.u).map(x=>letterOpt(x,true)), answer:L.u}; },
 chooseLetter(){ const L=pick(letters()); return {key:'L:'+L.u, prompt:'Trouve la grande lettre.', say:['Trouve la grande lettre.'], replay:[aLetter(L)], visual:`<div class="big-letter" style="color:var(--hibiscus)">${esc(L.l)}</div>`, kind:'choice', options:choices(letters(),L,4,x=>x.u).map(x=>letterOpt(x)), answer:L.u}; },
 listenLetter(){ return listenGen(letters,'lettre'); },
 imageLetter(){ return imageGen(letters); },
 vowelPick(){ const V=pick(vowels()); const opts=shuffle([V,...shuffle(consonants()).slice(0,3)]); return {key:'L:'+V.u, prompt:'Quelle est la voyelle ?', say:['Quelle est la voyelle ?'], visual:'', kind:'choice', options:opts.map(x=>letterOpt(x)), answer:V.u}; },
 listenVowel(){ return listenGen(vowels,'voyelle'); },
 imageVowel(){ return imageGen(vowels); },
 findVowels(){ const nv=2+Math.floor(Math.random()*2); const vs=shuffle(vowels()).slice(0,nv), cs=shuffle(consonants()).slice(0,8-nv); return {key:'X:findVowels', prompt:'Trouve toutes les voyelles.', say:['Trouve toutes les voyelles, puis touche Valider.'], visual:'', kind:'multi', options:shuffle([...vs,...cs]).map(x=>letterOpt(x)), answer:vs.map(x=>x.u).sort().join('')}; },
 consonantPick(){ const K=pick(consonants()); const opts=shuffle([K,...shuffle(vowels()).slice(0,3)]); return {key:'L:'+K.u, prompt:'Quelle est la consonne ?', say:['Quelle est la consonne ?'], visual:'', kind:'choice', options:opts.map(x=>letterOpt(x)), answer:K.u}; },
 listenConsonant(){ return listenGen(consonants,'consonne'); },
 imageConsonant(){ return imageGen(consonants); },
 soundConsonant(){ const pool=consonants().filter(x=>x.sound); const K=pick(pool); const opts=choices(pool,K,4,x=>x.sound); return {key:'LS:'+K.u, prompt:'Quelle lettre fait ce son ?', say:['Écoute le son.', 200, aSound(K), 300, 'Quelle lettre fait ce son ?'], replay:[aSound(K)], visual:speakerVisual, kind:'choice', options:opts.map(x=>letterOpt(x)), answer:K.u}; },
 listenSyll(){ const all=syllables(), s=pick(all); const near=all.filter(x=>x.c===s.c||x.v===s.v); return {key:'S:'+s.s, prompt:'Touche la bonne syllabe.', say:['Écoute et touche la bonne syllabe.',200,aSyll(s)], replay:[aSyll(s)], visual:speakerVisual, kind:'choice', options:choices(near.length>=4?near:all,s,4,x=>x.s).map(x=>({v:x.s,html:esc(wcase(x.s))})), answer:s.s}; },
 completeSyll(){ const s=pick(syllables()); return {key:'S:'+s.s, prompt:'Complète la syllabe.', say:['Complète la syllabe.',200,aSyll(s)], replay:[aSyll(s)], visual:`<div class="fusion"><span class="tile c">${esc(wcase(s.c))}</span><span class="op">+</span><span class="tile empty">?</span><span class="op">=</span><button class="tile res" data-act="replay">🔊</button></div>`, kind:'choice', options:choices(C.vowels,s.v,5).map(v=>({v,html:esc(wcase(v))})), answer:s.v, cols:3}; },
 buildSyll(){ const s=pick(syllables()); const dc=pick(C.families.filter(f=>f!==s.c))||'R', dv=pick(C.vowels.filter(v=>v!==s.v)); return {key:'S:'+s.s, prompt:'Forme la syllabe avec deux lettres.', say:['Forme la syllabe',200,aSyll(s)], replay:[aSyll(s)], visual:speakerVisual, kind:'build', slots:2, tiles:shuffle([s.c,s.v,dc,dv]), answer:[s.c,s.v]}; },
 wordForImage(){ const W=pick(C.words); return {key:'W:'+W.w, prompt:'Quel mot va avec l’image ?', say:['Quel mot va avec l’image ?'], visual:`<div class="media">${media(W)}</div>`, kind:'choice', options:choices(C.words,W,3,x=>x.w).map(x=>({v:x.w,html:esc(wcase(x.w)),cls:'wordopt'})), answer:W.w, cols:1}; },
 buildWord(){ const W=pick(C.words.filter(w=>w.syl.length>1)); const extra=pick(syllables().filter(x=>!W.syl.includes(x.s))); return {key:'W:'+W.w, prompt:'Reconstitue le mot.', say:['Reconstitue le mot',200,aWord(W)], replay:[aWord(W)], visual:`<div class="media">${media(W)}</div>`, kind:'build', slots:W.syl.length, tiles:shuffle([...W.syl, extra.s]), answer:W.syl}; },
 listenWord(){ const W=pick(C.words); return {key:'W:'+W.w, prompt:'Touche le bon mot.', say:['Écoute et touche le bon mot.',200,aWord(W)], replay:[aWord(W)], visual:speakerVisual, kind:'choice', options:choices(C.words,W,3,x=>x.w).map(x=>({v:x.w,html:esc(wcase(x.w)),cls:'wordopt'})), answer:W.w, cols:1}; },

 while(qs.length<n && guard++<200){ let q; if(custom.length && Math.random()<.25) q=G.custom(pick(custom)); else q=G[pick((C.levelTypes&&C.levelTypes[L.id])||L.types)]();
  if(qs.length && qs[qs.length-1].key===q.key) continue; qs.push(q); }

function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
const FONT_W = '700', FONT_F = '"Andika","Noto Sans NKo","Comic Sans MS",sans-serif';
class TraceBoard {
 constructor(wrap, target, onResult){ this.wrap=wrap; this.t=target; this.onResult=onResult; this.strokes=[]; this.cur=null; this.setup(); }
 setup(){ const t=this.t, H=330; let W=300;
  if(t.type==='text'){ this.fs = t.text.length===1?210:150; const c=document.createElement('canvas').getContext('2d'); c.font=`${FONT_W} ${this.fs}px ${FONT_F}`; c.direction=C.dir||'ltr'; W=Math.max(300,Math.ceil(c.measureText(t.text).width+100)); }
  else { this.s=(H*0.70)/120; this.ox=(W-100*this.s)/2; this.oy=H*0.13; }

  [this.g,this.a,this.k]=$$('canvas',this.wrap).map(c=>c.getContext('2d'));
  this.inkW = t.type==='text' ? this.fs*0.085 : 11*this.s;
  this.drawGuide(); this.tMask=this.maskOf(false); this.tDil=this.maskOf(true); this.bind(); }
 shape(ctx, mode){ // mode: 'guide' | 'mask' | 'dil'
  const t=this.t;
  if(t.type==='text'){ ctx.font=`${FONT_W} ${this.fs}px ${FONT_F}`; ctx.direction=C.dir||'ltr'; ctx.textAlign='center'; ctx.textBaseline='alphabetic'; const x=this.W/2, y=this.H*0.70;
   if(mode==='dil'){ ctx.lineWidth=this.fs*0.16; ctx.lineJoin='round'; ctx.strokeText(t.text,x,y); }
   ctx.fillText(t.text,x,y); if(mode==='guide'){ ctx.setLineDash([6,6]); ctx.lineWidth=1.5; ctx.strokeStyle=cssVar('--line-strong'); ctx.strokeText(t.text,x,y); ctx.setLineDash([]); } return; }
  ctx.save(); ctx.translate(this.ox,this.oy); ctx.scale(this.s,this.s); ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.lineWidth = mode==='guide'?18: mode==='mask'?12: 32;
  t.paths.forEach(d=>ctx.stroke(new Path2D(d)));
  if(mode==='guide'){ ctx.setLineDash([4,5]); ctx.lineWidth=1.6; ctx.strokeStyle=cssVar('--line-strong'); t.paths.forEach(d=>ctx.stroke(new Path2D(d))); ctx.setLineDash([]);
   t.paths.forEach((d,n)=>{ const m=d.match(/M\s*([\d.]+)[ ,]+([\d.]+)/); if(!m) return; ctx.fillStyle=cssVar('--leaf'); ctx.beginPath(); ctx.arc(+m[1],+m[2],7.5,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#fff'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(n+1,+m[1],+m[2]+.5); }); }
  ctx.restore(); }
 drawGuide(){ const g=this.g, W=this.W, H=this.H; g.clearRect(0,0,W,H);
  // lignage Seyès : interlignes fines, ligne d’écriture (base) et ligne des petites lettres plus marquées
  const base = this.t.type==='text' ? H*0.70 : this.oy+120*this.s; const unit = this.t.type==='text' ? this.fs*0.13 : (120*this.s)/8;
  for(let y=base-unit*8, n=-8; y<H; y+=unit, n++){ if(y<0) continue; g.strokeStyle = (n===0||n===-4)?cssVar('--line-strong'):cssVar('--line'); g.lineWidth=(n===0)?2.5:(n===-4?1.6:1); g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
  g.strokeStyle=cssVar('--margin'); g.lineWidth=2; g.beginPath(); g.moveTo(26,0); g.lineTo(26,H); g.stroke();
  g.fillStyle=cssVar('--guide'); g.strokeStyle=cssVar('--guide'); this.shape(g,'guide'); }
 maskOf(dil){ const c=document.createElement('canvas'); c.width=this.W; c.height=this.H; const x=c.getContext('2d'); x.fillStyle=x.strokeStyle='#000'; this.shape(x,dil?'dil':'mask'); return x.getImageData(0,0,this.W,this.H).data; }
 bind(){ const cv=this.k.canvas; const pos=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*this.W/r.width,(e.clientY-r.top)*this.H/r.height]; };

 paint(ctx, w, color){ ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=w; ctx.lineCap='round'; ctx.lineJoin='round';
  this.strokes.forEach(s=>{ if(s.length===1){ ctx.beginPath(); ctx.arc(s[0][0],s[0][1],w/2,0,Math.PI*2); ctx.fill(); return; } ctx.beginPath(); ctx.moveTo(...s[0]); s.forEach(p=>ctx.lineTo(...p)); ctx.stroke(); }); }
 redraw(){ this.k.clearRect(0,0,this.W,this.H); this.paint(this.k,this.inkW,cssVar('--ink')); }
 clear(){ this.strokes=[]; this.redraw(); }
 evaluate(){ const pts=this.strokes.reduce((n,s)=>n+s.length,0); if(pts<4) return {grade:'empty'};
  const mk=w=>{ const c=document.createElement('canvas'); c.width=this.W; c.height=this.H; const x=c.getContext('2d'); this.paint(x,w,'#000'); return x.getImageData(0,0,this.W,this.H).data; };
  const u=mk(this.inkW), uD=mk(this.inkW*2.6); let t=0,tc=0,un=0,uc=0;
  for(let i=3;i<u.length;i+=4*3){ const inT=this.tMask[i]>100; if(inT){ t++; if(uD[i]>100) tc++; } if(u[i]>100){ un++; if(this.tDil[i]>100) uc++; } }
  const cov=t?tc/t:0, prec=un?uc/un:0;

  return {grade,cov,prec}; }
 stopAnim(){ cancelAnimationFrame(this.raf); this.a.clearRect(0,0,this.W,this.H); }
 demo(){ this.stopAnim(); const a=this.a, ink=cssVar('--hibiscus');
  if(this.t.type==='text'){ const t0=performance.now(), dur=1800; const step=now=>{ const k=Math.min(1,(now-t0)/dur); a.clearRect(0,0,this.W,this.H); a.save(); a.beginPath(); a.rect(0,0,this.W*k,this.H); a.clip(); a.globalAlpha=.55; a.fillStyle=ink; this.shape(a,'mask'); a.restore(); if(k<1) this.raf=requestAnimationFrame(step); else setTimeout(()=>this.a.clearRect(0,0,this.W,this.H),900); }; this.raf=requestAnimationFrame(step); return; }
  const svgNS='http://www.w3.org/2000/svg'; const svg=document.createElementNS(svgNS,'svg'); svg.style.cssText='position:absolute;width:0;height:0;overflow:hidden'; document.body.appendChild(svg);
  const segs=this.t.paths.map(d=>{ const p=document.createElementNS(svgNS,'path'); p.setAttribute('d',d); svg.appendChild(p); return {p,len:p.getTotalLength()}; });
  const total=segs.reduce((s,x)=>s+x.len,0), speed=0.16, t0=performance.now();
  const step=now=>{ let dist=(now-t0)*speed; a.clearRect(0,0,this.W,this.H); a.save(); a.translate(this.ox,this.oy); a.scale(this.s,this.s); a.lineCap='round'; a.lineJoin='round'; a.lineWidth=10; a.strokeStyle=ink; let tip=null;
   for(const sg of segs){ const L=Math.min(sg.len,dist); if(L<=0) break; a.beginPath(); for(let l=0;l<=L;l+=2){ const q=sg.p.getPointAtLength(l); l===0?a.moveTo(q.x,q.y):a.lineTo(q.x,q.y); } tip=sg.p.getPointAtLength(L); a.stroke(); dist-=sg.len+12; }
   if(tip){ a.fillStyle=cssVar('--sun'); a.beginPath(); a.arc(tip.x,tip.y,8,0,Math.PI*2); a.fill(); } a.restore();
   if((now-t0)*speed < total+12*segs.length) this.raf=requestAnimationFrame(step); else { svg.remove(); setTimeout(()=>this.a.clearRect(0,0,this.W,this.H),1000); } };
  this.raf=requestAnimationFrame(step); }
}

ACT.writeCheck = () => { if(!BOARD) return; const r=BOARD.evaluate(); const v=$('#verdict'); const p=CUR.params; const it=(p.list||WRITE_SETS[p.set||'upper'].items())[p.k||0];
 if(r.grade==='empty'){ v.className='verdict warn'; v.textContent='✋ Trace la lettre avec ton doigt.'; say(['Trace la lettre avec ton doigt.']); return; }
 const M={good:['✅ Bonne écriture !','Bonne écriture ! Bravo !'],warn:['⚠️ À améliorer','C’est presque ça. Essaie de suivre le modèle.'],bad:['❌ Recommence','Recommence en suivant les pointillés.']}[r.grade];
 v.className='verdict '+r.grade; v.textContent=M[0]; say([M[1]]); r.grade==='good'?sfxGood():sfxBad();
 if(r.grade==='good'){ P.goodTraces++; markLearned(it.key); }
 const sess=p.session; record(it.key, r.grade==='good');
 if(sess){ if(sess.res[p.k]==null) sess.res[p.k] = r.grade==='good'?1:r.grade==='warn'?0.5:0; if(r.grade!=='bad'||sess.mode==='quiz'){ setTimeout(()=>{ if(CUR.name!=='write') return; if(p.k<p.list.length-1){ p.k++; render(false); } else finishTraceSession(); },1500); } } };
function startTraceSession(i,mode){ const n=mode==='quiz'?6:5; const up=shuffle(WRITE_SETS.upper.items()).slice(0,mode==='quiz'?4:3), lo=shuffle(WRITE_SETS.lower.items()).slice(0,n-up.length);
 const list=[...up,...lo]; go('write',{list,k:0,session:{i,mode,res:[]}},CUR.name==='result'); }
function finishTraceSession(){ const p=CUR.params, sess=p.session; const score=sess.res.reduce((a,b)=>a+(b||0),0); SES={i:sess.i,mode:sess.mode,qs:p.list,score:Math.round(score*10)/10,res:sess.res};
 const L=LEVELS[sess.i], st=levelState(L.id); const pct=Math.round(score/p.list.length*100); let stars=0,passed=false,newly=false;
 if(sess.mode==='quiz'){ st.attempts++; stars=pct>=95?3:pct>=85?2:pct>=S.threshold?1:0; passed=pct>=S.threshold; st.best=Math.max(st.best,pct); st.stars=Math.max(st.stars,stars); if(passed&&!st.passed){ st.passed=true; newly=true; } if(pct===100) award('perfect'); checkBadges(); }
 saveProg(); SES.result={pct,stars,passed,newly}; go('result',{},true); }

function audioCatalog(){ const out=[];
 const nk=!!C.noCase;
 C.letters.forEach(L=>out.push({g:'Lettres : nom',key:'L:'+L.u,text:nk?L.u:L.name,hint:nk?'se lit « '+L.name+' »':'nom de '+L.u}));
 C.letters.filter(L=>L.sound).forEach(L=>out.push({g:'Lettres : son',key:'LS:'+L.u,text:nk?L.u:L.sound,hint:nk?'son « '+L.sound+' »':'son de '+L.u}));
 C.letters.filter(L=>L.word).forEach(L=>out.push({g:'Lettres : mot',key:'LW:'+L.u,text:nk?L.word:L.word.toLowerCase(),hint:nk?(L.wordSay||'')+' · mot de '+L.u:'mot de '+L.u}));
 syllables().forEach(x=>out.push({g:'Syllabes',key:'S:'+x.s,text:nk?x.s:x.say,hint:nk?x.say:x.s}));
 C.words.forEach(W=>out.push({g:'Mots',key:'W:'+W.w,text:nk?W.w:W.w.toLowerCase(),hint:nk?(W.tr||'')+(W.fr?' — '+W.fr:''):'mot entier'}));
 C.words.forEach(W=>W.syl.forEach((x,k)=>out.push({g:'Mots : syllabes',key:'W:'+W.w+':'+k,text:nk?x:(W.say?.[k]||x.toLowerCase()),hint:(nk?(W.say?.[k]||'')+' · ':'')+`${k+1}ᵉ syllabe de ${W.w}`})));
 C.phrases.forEach(ph=>out.push({g:'Phrases',key:'P:'+ph.id,text:phraseText(ph),hint:ph.tr?ph.tr+(ph.fr?' — '+ph.fr:''):'phrase'}));
 return out; }

const safeName = k => k.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_');
const EXT = {'audio/webm':'webm','audio/ogg':'ogg','audio/mp4':'m4a','audio/mpeg':'mp3','audio/wav':'wav','audio/x-wav':'wav','audio/aac':'aac'};
function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
ACT.exportVoices = async () => { try{ await loadScript('lib/jszip.min.js'); const zip=new JSZip(); const lang=S.contentLang; const index={...SERVER_AUDIO}; const used=new Set(); let n=0;
  for(const [key,v] of Object.entries(C.audio)){ let blob=null; if(v==='idb') blob=await AudioDB.get(idbKey(key)); else if(String(v).startsWith('data:')) blob=await (await fetch(v)).blob(); if(!blob) continue;
   let name=safeName(key); while(used.has(name)) name+='_'; used.add(name); const file=`${name}.${EXT[(blob.type||'').split(';')[0]]||'webm'}`; zip.file(`audio/${lang}/${file}`, blob); index[key]=`audio/${lang}/${file}`; n++; }
  if(!n){ toast('Aucun son enregistré sur cet appareil.'); return; }
  zip.file(`audio/${lang}/index.json`, JSON.stringify(index,null,1)); const out=await zip.generateAsync({type:'blob'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(out); a.download=`sons-${lang}-${today()}.zip`; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },4000); toast(`${n} sons exportés.`); }
 catch(e){ toast('Export impossible : '+(e.message||e)); } };

/* ----- Installation (PWA) et mode hors ligne ----- */
let INSTALL_EVT=null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALL_EVT=e; if(CUR&&['home','settings'].includes(CUR.name)) rerender(); });
window.addEventListener('appinstalled', () => { INSTALL_EVT=null; toast('Application installée ! Retrouvez-la sur l’écran d’accueil. 🎉',3600); if(CUR&&['home','settings'].includes(CUR.name)) rerender(); });
ACT.install = async () => { if(!INSTALL_EVT){ go('installHelp'); return; } INSTALL_EVT.prompt(); try{ await INSTALL_EVT.userChoice; }catch(e){} INSTALL_EVT=null; rerender(); };
SCREENS.installHelp = () => `${topbar('Installer l’application','<span></span>')}<div class="stack fade-in">
 <div class="card stack"><b>Sur Android (Chrome)</b><ol style="margin:0;padding-left:22px;line-height:1.7"><li>Ouvrez l’adresse de l’application dans Chrome.</li><li>Touchez le menu <b>⋮</b> en haut à droite.</li><li>Choisissez <b>« Installer l’application »</b> ou <b>« Ajouter à l’écran d’accueil »</b>.</li><li>L’icône <b>Aa</b> apparaît avec vos autres applications.</li></ol></div>
 <p class="note">Après la première ouverture avec Internet, tout fonctionne sans connexion : leçons, images, polices et sons.</p></div>`;
let OFFLINE_READY=false;
async function offlineInfo(){ const out={sw:OFFLINE_READY, persisted:null, used:null};
 try{ if(navigator.storage?.persisted) out.persisted=await navigator.storage.persisted(); if(navigator.storage?.estimate){ const e=await navigator.storage.estimate(); out.used=e.usage; out.quota=e.quota; } }catch(e){} return out; }
AFTER.settings = async () => { const box=$('#offline-box'); if(!box) return; const i=await offlineInfo(); if(!$('#offline-box')) return;
 const mb=x=>x==null?'—':(x/1048576).toFixed(1)+' Mo';
 box.innerHTML = `<b>Hors ligne</b><p class="note">${i.sw?'✅ L’application est enregistrée sur ce téléphone et marche sans Internet.':window.JAL_PWA?'⏳ Préparation hors ligne… gardez Internet ouvert quelques secondes.':'Version de démonstration : installez la version téléphone pour le mode hors ligne.'}</p>
  <p class="note">Espace utilisé : ${mb(i.used)}${i.persisted===true?' · 🔒 données protégées contre l’effacement automatique':''}</p>`; };

/* ---------- 6. SYNCHRO (facultative) ---------- */
const Sync = {
 async push(){ const url=S.sync.url.replace(/\/$/,''), key=S.sync.key; if(!url||!key) throw new Error('Renseignez l’adresse et la clé.');
  const rows=PROFILES.map(pr=>({id:pr.id,name:pr.name,avatar:pr.avatar,progress:profStats(pr),updated_at:new Date().toISOString()}));
  const r=await fetch(url+'/rest/v1/learners',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify(rows)});
  if(!r.ok) throw new Error('Erreur '+r.status+' : '+(await r.text()).slice(0,140)); return rows.length; }
};
ACT.syncPush = async () => { S.sync={url:$('#sb-url').value.trim(),key:$('#sb-key').value.trim()}; saveSettings(); const m=$('#sync-msg'); m.textContent='Envoi…';
 try{ const n=await Sync.push(); m.textContent=`✅ ${n} apprenant(s) envoyé(s).`; }catch(e){ m.textContent='❌ '+(e.message||'Connexion impossible. Vérifiez Internet.'); } };

/* ---------- événements globaux ---------- */
document.addEventListener('click', e => { const el=e.target.closest('[data-act]'); if(!el||el.disabled) return; const fn=ACT[el.dataset.act]; if(fn){ e.preventDefault(); fn(el.dataset.arg, el, e); } });
document.addEventListener('change', e => { const el=e.target;
 if(el.dataset.actChange){ const [n,arg]=el.dataset.actChange.split(':'); CHANGE[n]&&CHANGE[n](el,arg); return; }
 if(el.dataset.edit){ let v = el.type==='checkbox'?el.checked:el.value.trim(); if(el.dataset.upper) v=v.toUpperCase(); if(el.dataset.split) v=v.split('-').map(s=>s.trim()).filter(Boolean);
  if(el.dataset.edit.endsWith('.syl')) { const i=+el.dataset.edit.split('.')[1]; v=v.map(s=>s.toUpperCase()); C.words[i].w=v.join(''); }
  setPath(C, el.dataset.edit, v); saveContent(); toast('Enregistré.',1200); return; }
 if(el.dataset.file){ const f=el.files[0]; if(!f) return; const [kind,ref]=[el.dataset.file.slice(0,el.dataset.file.indexOf(':')), el.dataset.file.slice(el.dataset.file.indexOf(':')+1)];
  if(kind==='audio'){ if(f.size>3000000){ toast('Son trop lourd (3 Mo maximum). Raccourcissez-le.',3600); return; } storeAudio(ref,f).then(()=>{ rerender(); toast('Son ajouté.'); }, e=>toast(e.message||'Impossible d’enregistrer ce son.')); }
  if(kind==='img'){ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const m=200, sc=Math.min(1,m/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc); c.getContext('2d').drawImage(im,0,0,c.width,c.height); let url=c.toDataURL('image/webp',.82); if(!url.startsWith('data:image/webp')) url=c.toDataURL('image/jpeg',.82); getPath(C,ref).img=url; saveContent(); rerender(); toast('Image ajoutée.'); }; im.src=r.result; }; r.readAsDataURL(f); } } });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) saveProg(); });

/* démarrage */
applyLangAttrs();
CUR={name:'home',params:{}}; render(true);
loadServerAudio();
if(window.JAL_PWA && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    navigator.serviceWorker.ready.then(()=>{ OFFLINE_READY=true; if(CUR.name==='settings') AFTER.settings(); });
    reg.addEventListener('updatefound',()=>{ const w=reg.installing; w&&w.addEventListener('statechange',()=>{ if(w.state==='installed'&&navigator.serviceWorker.controller) toast('Nouvelle version installée. Elle sera utilisée à la prochaine ouverture.',4000); }); });
  }).catch(()=>{});
  // demande au navigateur de ne pas effacer la progression et les sons
  document.addEventListener('click',()=>{ try{ navigator.storage?.persist?.(); }catch(e){} },{once:true});
}
</script>
